# ABOUTME: Example llm-registre configuration — copy to registre.toml at your repo root
# ABOUTME: Every key is optional; the matching REGISTRE_* environment variable wins over it

# Where limitation issues are filed. Normally a PRIVATE tracker, separate from
# the code repo: when the code is public, a precise inventory of incomplete
# defences is a roadmap. Leave unset and the gates still enforce the format —
# only the "file it in X" guidance goes generic.
tracker = "your-org/your-private-tracker"

# The word inside LIMITATION(...). Choose once and keep it: it is embedded in
# every source comment across the codebase.
marker = "registre"

# Dark-launch ledger path — features that ship disarmed (flag off, shadow mode,
# log-only phase), each with a review_by date.
ledger = "feature-phases.yaml"

# true = the ledger file must exist (an empty `features:` list is valid).
# false = it is format-checked only when present.
require_ledger = false

# Source extensions to scan, comma-separated and bare (no dot). The default
# suits a Rust/TypeScript repo; a Java project uses "java,ts,js", a Swift
# package "swift" (its capitalised Tests/ tree is excluded like the others).
extensions = "rs,ts,tsx"

# Extra exclude globs, on top of the built-in test/generated conventions
# (**/tests/**, **/src/test/**, *Test.java, *.spec.ts, **/target/**, …).
# exclude = "**/legacy/**,**/third_party/**"

# File length cap (gate 4). Unset or 0 = gate off; when set, any scanned file
# over this many lines fails — extract a focused helper instead.
# max_file_lines = 500

# Clippy lints that may be silenced inline (gate 5), comma-separated bare
# names. Unset = gate off; when set, any #[allow(clippy::…)] or
# #[expect(clippy::…)] naming a lint outside this list fails. Declare the
# policy here once instead of copying it across script, manifest, and docs.
# allowed_inline_allows = "cast_possible_truncation,too_many_lines"
